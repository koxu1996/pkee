[package]
name = "pkee-core"
description = "pkee core: KDBX key slots, search and frecency"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
base64.workspace = true
# CTAP2 client over hidraw (pure Rust); talks to linux-passkey like any USB key.
ctap-hid-fido2.workspace = true
getrandom.workspace = true
hex.workspace = true
hkdf.workspace = true
keepass.workspace = true
nucleo-matcher.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Tests build throwaway databases.
keepass = { workspace = true, features = ["save_kdbx4"] }
