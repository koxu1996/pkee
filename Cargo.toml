[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
aes-gcm = "0.11"
anyhow = "1"
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
ctap-hid-fido2 = "3.6"
getrandom = "0.3"
hex = "0.4"
hkdf = "0.13"
keepass = "0.17"
pkee-core = { path = "crates/pkee-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zeroize = "1"
